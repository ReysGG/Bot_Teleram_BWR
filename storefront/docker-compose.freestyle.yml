name: telegram-storefront-freestyle

services:
  app:
    image: telegram-storefront:freestyle-test
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 25s
      retries: 3
